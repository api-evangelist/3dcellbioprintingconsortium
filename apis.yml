aid: 3dcellbioprintingconsortium
name: 3D Cell Bioprinting Consortium
description: >-
  The 3D Cell Bioprinting Consortium (traded on the EquityZen secondary marketplace under the
  symbol TDCC) is an alliance of laboratory-instrument and biomaterials companies formed in
  2016 and publicly launched in February 2017, headquartered in Marlborough, Massachusetts.
  It describes itself as "a group of companies focused on offering the complete solution for
  tissue engineering" — coordinating bioprinter hardware, bioinks and hydrogels, cell lines
  and culture reagents into a single workflow for pre-clinical drug discovery, regenerative
  medicine and diagnostics. It was founded by Sid Braginsky, CEO and Chairman of Digilab
  Corp., and its named members include Digilab, Inc. (maker of the CellJet cell printer,
  represented by President and COO John Moore) and 3-D Matrix, Inc. (self-assembling peptide
  hydrogels, represented by Managing Director Marc Rioult). The consortium is a coordinating
  body for physical laboratory products, not a software vendor: it publishes no first-party
  website, developer portal, documentation, SDK, or machine-readable API specification, and
  no domain matching its name resolves in DNS. This profile is an independent third-party
  record; there is no API surface to enrich.
