x-domain-note: >-
  No first-party domain was found. Six name-derived candidates were probed and every one is
  NXDOMAIN (3dcellbioprintingconsortium.com/.org, 3dcellbioprinting.com/.org,
  bioprintingconsortium.org, cellbioprintingconsortium.com). The only reachable record of the
  company is the EquityZen secondary-market listing, which is a trading venue and NOT the
  company's web presence, so it is recorded as x-harvest-source-url and is deliberately not
  wired as a Website pointer (roadmap#56). Note also that digilabglobal.com — the former host
  of founding member Digilab, Inc. — has been re-registered and now serves an unrelated
  online-gambling site, so it is not usable as a consortium surface either.
